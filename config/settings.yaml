app:
  host: 127.0.0.1
  port: 8000
  open_browser: true
  log_level: INFO
  timeframe: 5m
  poll_interval: 60
account:
  starting_balance: 10000.0
  currency: USD
risk:
  max_position_size: 100
  max_daily_loss: 300.0
  max_drawdown: 1500.0
  risk_per_trade: 150.0
  commission_per_share: 0.0
  slippage_cents: 0.01
  stop_loss_pct: 0.04
  take_profit_pct: 0.06
  trail_pct: 0.03
  crypto_stop_loss_pct: 0.025
  crypto_take_profit_pct: 0.04
  atr_stop_multiplier: 2.0
  atr_tp_multiplier: 4.0
  # Minimum entry value in USD. Unit quantities are derived from the latest
  # price (e.g. $5 / ETH price), so BTC, ETH and fractional stocks stay above
  # Alpaca's minimum order value. Crypto uses $12 to stay safely above its
  # current $10 cost-basis minimum.
  min_stock_order_notional: 5.0
  min_crypto_order_notional: 12.0
portfolio:
  max_pct_per_position: 0.1
  max_pct_per_sector: 0.3
  max_positions: 15
  min_cash_pct: 0.05
