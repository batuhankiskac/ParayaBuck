# ParayaBuck settings — Alpaca (US stocks)

# --- General program settings ---
app:
  host: 127.0.0.1
  port: 8000
  open_browser: true
  log_level: INFO
  timeframe: 15m
  poll_interval: 60

# --- Account ---
account:
  starting_balance: 10000.0    # USD paper starting balance
  currency: USD

# --- Risk ---
risk:
  max_position_size: 100       # max shares per trade
  max_daily_loss: 300.0        # USD — stop trading if daily PnL <= -this
  max_drawdown: 1500.0         # USD — stop trading if account dips this much from peak
  risk_per_trade: 150.0        # USD — used for position sizing
  commission_per_share: 0.0    # Alpaca is commission-free
  slippage_cents: 0.01         # simulated slippage in dollars on each fill

# --- Portfolio risk ---
portfolio:
  max_pct_per_position: 0.10   # max 10% of equity in one stock
  max_pct_per_sector: 0.30     # max 30% of equity in one sector
  max_positions: 15            # max concurrent open positions
  min_cash_pct: 0.05           # always keep 5% in cash

# --- Symbols (US stocks + crypto pairs) ---
# Crypto pairs use "BASE/USD" format (e.g. BTC/USD) and trade 24/7.
symbols:
  # --- Stocks ---
  AAPL:
    tick_size: 0.01
    point_value: 1.0
  MSFT:
    tick_size: 0.01
    point_value: 1.0
  GOOGL:
    tick_size: 0.01
    point_value: 1.0
  TSLA:
    tick_size: 0.01
    point_value: 1.0
  NVDA:
    tick_size: 0.01
    point_value: 1.0
  AMZN:
    tick_size: 0.01
    point_value: 1.0
  SPY:
    tick_size: 0.01
    point_value: 1.0
  QQQ:
    tick_size: 0.01
    point_value: 1.0
  KO:
    tick_size: 0.01
    point_value: 1.0
  PEP:
    tick_size: 0.01
    point_value: 1.0
  JNJ:
    tick_size: 0.01
    point_value: 1.0
  JPM:
    tick_size: 0.01
    point_value: 1.0
  XOM:
    tick_size: 0.01
    point_value: 1.0
  # --- Sector ETFs (for SectorRotation strategy) ---
  XLK:
    tick_size: 0.01
    point_value: 1.0
  XLF:
    tick_size: 0.01
    point_value: 1.0
  XLE:
    tick_size: 0.01
    point_value: 1.0
  XLV:
    tick_size: 0.01
    point_value: 1.0
  XLY:
    tick_size: 0.01
    point_value: 1.0
  XLP:
    tick_size: 0.01
    point_value: 1.0
  XLI:
    tick_size: 0.01
    point_value: 1.0
  XLB:
    tick_size: 0.01
    point_value: 1.0
  XLU:
    tick_size: 0.01
    point_value: 1.0
  XLRE:
    tick_size: 0.01
    point_value: 1.0
  XLC:
    tick_size: 0.01
    point_value: 1.0
  # --- Benchmark / safe-asset proxies (for DualMomentum + market filter) ---
  BIL:
    tick_size: 0.01
    point_value: 1.0
  VIXY:
    tick_size: 0.01
    point_value: 1.0
  # --- Crypto (fractional qty, 24/7) ---
  BTC/USD:
