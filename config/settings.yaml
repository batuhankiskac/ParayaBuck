app:
  host: 127.0.0.1
  port: 8000
  open_browser: true
  # Trading never starts from this file alone. The engine starts only on the
  # machine that sets PARAYABUCK_TRADING_HOST=1 (the systemd unit on the VM);
  # everywhere else `parayabuck web` serves the console and backtests and
  # refuses to trade, so auto-start is safe to leave on: only the designated
  # host (the VM) actually starts trading after a restart.
  auto_start_engine: true
  log_level: INFO
runtime:
  mode: paper
  execution_timeframe: 5m
  market_state_timeframe: 5m
  decision_db_path: data/runtime/parayabuck.sqlite3
alpaca:
  data_delayed: false
  # Live Basic streaming: IEX exchange prints only (NOT the consolidated
  # SIP/NBBO tape). SIP real-time streaming requires a paid entitlement.
  stock_stream_feed: iex
  # Historical bars/quotes: SIP for consolidated coverage where the account
  # entitlement allows; falls back to IEX gracefully otherwise.
  stock_historical_feed: sip
data:
  equity_session: regular
  include_extended_hours: false
universe:
  equity:
    enabled: true
    maximum_stream_symbols: 30
    # Static universe: QQQ is the equity strategy's trend signal, QLD
    # (2x Nasdaq-100) its only holding, SPY the benchmark. Leftover managed
    # positions are pinned by the runtime until sold.
    symbols:
    - SPY
    - QQQ
    - QLD
strategy:
  # The strategy owns its signal timeframe; strategy.*.timeframe is a
  # deprecated compatibility key and intentionally omitted here.
  # equity_leveraged_trend_v1 (VT35) — PAPER identity since 2026-09-25:
  # hold QLD (2x Nasdaq-100) while QQQ's completed close is above its
  # 200-session SMA, sized min(1, 0.35 / 20-session realized QLD volatility),
  # cash otherwise; decided every session. Validated by
  # docs/research/profit_max_v1.md (29.0% CAGR, 29.2% max drawdown vs VOO
  # 14.5% / 32.0%, 2017-2026 shared-ledger replay). The residual-momentum V3
  # and dividend/gold sleeve identities were removed; they are recoverable
  # from git history (tag archive/research/profit-max-v1-2026-09 records the
  # evidence). LIVE remains disabled.
  equity:
    enabled: true
    name: equity_leveraged_trend_v1
    # 2026-09-29 (paper_config_v2): equity 0.93 -> 0.98 = max_gross; cash
    # buffer 0.02. Stage B 2017-2026: 29.35% CAGR, 27.7% max drawdown
    # (docs/research/paper_config_v2.md). The crypto sleeve was removed
    # (docs/research/crypto_removal_v1.md); the bot is equity-only.
    maximum_allocation: 0.98
    parameters:
      signal_symbol: QQQ
      hold_symbol: QLD
      sma_bars: 200
      vol_target: 0.35
      vol_window: 20
      rebalance_frequency: hours:24
risk:
  # 2026-09-25 (profit_max_v1): limits widened for the single-ETF equity
  # identity. The per-asset cap admits the whole equity allocation in QLD,
  # and the daily-loss (0.20) and drawdown (0.75) latches are catastrophe
  # brakes only: a 2x index ETF routinely moves more than the former
  # 0.5% / 5% latches, which would have blocked the strategy.
  # 2026-09-29 (paper_config_v2): 0.93 -> 0.98 with the equity allocation.
  max_position_pct: 0.98
  cash_buffer_pct: 0.02
  max_gross_exposure_pct: 0.98
  max_positions: 8
  daily_loss_limit_pct: 0.20
  max_drawdown_pct: 0.75
backtest:
  initial_cash: 100000
  slippage_bps: 2
  spread_bps: 2
  commission: 0
  # Equity regulatory fees use the effective-dated schedule by trade date
  # (SEC Section 31, FINRA TAF, CAT NMS Plan). The fixed values below are the
  # 2026 rates and only apply when effective-dated fees are disabled.
  equity_use_effective_dated_fees: true
  equity_taf_per_share: 0.000195
  equity_taf_cap: 9.79
  equity_cat_per_share: 0.000003
  equity_sec_fee_rate: 0.0000206
  output_dir: reports
  ranking_metric: risk_adjusted
live:
  enabled: false
  hard_dollar_cap: 0
  operator_approval_path: ""
  operator_approval_key_env: PARAYABUCK_OPERATOR_APPROVAL_KEY
engine:
  manage_external_positions: false
  event_grace_seconds: 5
  data_finalization_grace_seconds: 2
  maximum_queue_age_seconds: 30
  account_poll_interval_seconds: 15
  maximum_account_age_for_entry_seconds: 30
  event_queue_capacity: 1024
execution:
  # Shared order-existence policy for backtest, paper and live: a rebalance
  # band below which drift produces no order, and the minimum order notional.
  # These values change order behavior and are part of the configuration and
  # live-authorization digests.
  rebalance_band_pct: 0.005
  minimum_order_notional: 10
backup:
  # Consistent SQLite snapshots of the runtime decision database
  # (runtime.decision_db_path), taken with the sqlite3 online backup API so
  # the copy stays safe while the WAL-mode runtime database is open.
  path: data/backups
  retention_days: 7
alerting:
  # Event-notification sink for runtime operators. The console/log sink is
  # always attached; webhook_url enables an additional generic POST sink
  # (also overridable via PARAYABUCK_ALERT_WEBHOOK_URL). Failure events are
  # throttled per kind so a broken data provider or broker cannot spam the webhook.
  # Keep the URL (it is a credential) out of this file: leave webhook_url
  # empty and set PARAYABUCK_ALERT_WEBHOOK_URL in the service EnvironmentFile.
  enabled: true
  webhook_url: ""
  # One-line summary after each equity session-close decision (event
  # daily_summary; log/journal always, webhook when a URL is configured).
  daily_summary: true
  events:
  - runtime_started
  - runtime_stopped_unexpected
  - runtime_start_failed
  - backup_failed
  - data_provider_unavailable
  - order_rejected
  - ambiguous_order
  - reconciliation_failure
  - reconciliation_recovered
  - risk_incident
  - drawdown_halt
  - risk_epoch_reset
  - circuit_breaker
  - signal_adjustment_failure
  - signal_adjustment_recovery
  - paper_incident
  - daily_summary
  - intent_alarm
  - intent_recovered
  - signal_source_mismatch
  - market_data_degraded
  - session_close_bar_incomplete
  - reconciliation_unexpected_fill_side
intent_watchdog:
  # Intent-vs-reality watchdog (observability only; never gates trading).
  # Alarms (alert kind intent_alarm) when, on the NYSE calendar, no equity
  # decision exists for the last session after its close + grace (a 13:00 ET
  # early close is expected at 13:00 ET, not 16:00 ET), or when a positive
  # target is not held (held < minimum_held_fraction x target) after the
  # fill window (next open + grace).
  # Active alarms appear as degraded_reasons in /readyz and /api/status.
  enabled: true
  equity_decision_grace_minutes: 45
  equity_fill_grace_minutes: 30
  minimum_held_fraction: 0.5
  fail_readiness: true
  evaluation_interval_seconds: 60
signal_cross_check:
  # Second-source check of the equity session-close signal (runtime only;
  # the offline backtest has one source and is unaffected). The decision bar
  # is built from IEX 1-minute stream bars; the check recomputes the trend
  # state and target weight on the Alpaca consolidated SIP daily bar of the
  # same session (split-adjusted, uncached, explicit sip feed):
  # - sources agree on the trend: trade as usual;
  # - they disagree: hold the current position this session (no orders),
  #   flag the decision, alert signal_source_mismatch, and the intent
  #   watchdog reports equity_signal_source_hold;
  # - no SIP bar within the retry window: decide on the IEX bar and alert;
  # - closes differ by more than close_divergence_bps: alert (trend agrees).
  # The decision waits (deferred, not blocking) for the SIP bar; orders
  # queue for the next open either way. embargo + window must stay below
  # intent_watchdog.equity_decision_grace_minutes.
  # docs/research/signal_cross_check_v1.md
  enabled: true
  # Alpaca Basic rejects SIP queries reaching into the last 15 minutes; use
  # 0 only with a real-time SIP data subscription. Also clamps the end of
  # every historical SIP bar request (warmup, hourly split-basis verifier),
  # whether or not the cross-check is enabled.
  sip_embargo_minutes: 15
  retry_window_minutes: 10
  retry_interval_seconds: 60
  close_divergence_bps: 50
