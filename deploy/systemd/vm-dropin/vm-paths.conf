# VM drop-in for the home-dir layout (the current VM: checkout at ~/ParayaBuck,
# user batuhankiskac). Example, not a template to copy blindly.
#
# Install (one drop-in per unit, names must end in .conf):
#   sudo install -d /etc/systemd/system/parayabuck.service.d
#   sudo install -m 0644 deploy/systemd/vm-dropin/vm-paths.conf \
#        /etc/systemd/system/parayabuck.service.d/vm-paths.conf
#   sudo systemctl daemon-reload
#
# Replace /home/batuhankiskac and batuhankiskac with the output of
#   getent passwd batuhankiskac | cut -d: -f6
# before installing. Every list-valued key is reset with an empty assignment
# first, so this drop-in replaces the template value instead of adding to it.
# Keep the fresh-install template (/opt/parayabuck) unchanged; this file exists
# only for the home-dir layout.
#
# Check the result with:
#   systemctl show parayabuck -p User,Group,WorkingDirectory,ProtectHome,Type,WatchdogUSec
#   systemctl cat parayabuck

[Service]
User=batuhankiskac
Group=batuhankiskac
WorkingDirectory=/home/batuhankiskac/ParayaBuck
EnvironmentFile=
EnvironmentFile=/home/batuhankiskac/ParayaBuck/.env
# S3-4-2: the engine must not see the deploy user's home (~/.config/gcloud, ~/.ssh),
# which holds no key it needs. It sees only the checkout, read-only; the writable
# paths are re-added below. The off-host copy has its own drop-in (vm-paths-backup.conf).
ProtectHome=tmpfs
BindReadOnlyPaths=/home/batuhankiskac/ParayaBuck
ReadWritePaths=
ReadWritePaths=/home/batuhankiskac/ParayaBuck/config /home/batuhankiskac/ParayaBuck/data
ReadWritePaths=-/home/batuhankiskac/ParayaBuck/reports
# S2-10-5: the engine reads the restore points but cannot rewrite them. The
# template's /opt path is reset first; the backup unit keeps write access.
ReadOnlyPaths=
ReadOnlyPaths=-/home/batuhankiskac/ParayaBuck/data/backups
ExecStartPre=
ExecStartPre=/home/batuhankiskac/ParayaBuck/.venv/bin/parayabuck doctor --strict --configured-mode --offline
ExecStart=
ExecStart=/home/batuhankiskac/ParayaBuck/.venv/bin/parayabuck web
