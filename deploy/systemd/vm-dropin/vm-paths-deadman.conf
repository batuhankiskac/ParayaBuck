# VM drop-in for parayabuck-deadman.service on the home-dir layout (checkout
# ~/ParayaBuck, user batuhankiskac). Example, not a template to copy blindly
# (S3-4-3, D3-4-6): the template names the parayabuck user and /opt paths, which the
# VM does not have, so the unit fails with 217/USER or 200/CHDIR until this applies.
#
# Install (the base unit must already be in /etc/systemd/system; see the dead-man
# section of docs/deployment.md):
#   sudo install -d /etc/systemd/system/parayabuck-deadman.service.d
#   sudo install -m 0644 deploy/systemd/vm-dropin/vm-paths-deadman.conf \
#        /etc/systemd/system/parayabuck-deadman.service.d/vm-paths-deadman.conf
#   sudo systemctl daemon-reload
#
# ProtectHome stays read-only: the checkout (and its .venv) lives under the home
# directory, and the unit writes nothing. The heartbeat URL is still read only from
# $CREDENTIALS_DIRECTORY (LoadCredential=).
#
# Check the result with:
#   systemctl show parayabuck-deadman -p User,WorkingDirectory,ProtectHome,ExecStart

[Service]
User=batuhankiskac
Group=batuhankiskac
WorkingDirectory=/home/batuhankiskac/ParayaBuck
ExecStart=
ExecStart=/home/batuhankiskac/ParayaBuck/.venv/bin/python -m parayabuck.monitoring.deadman
ProtectHome=read-only
