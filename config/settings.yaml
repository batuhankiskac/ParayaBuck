    point_value: 1.0

# --- Strategy defaults ---
strategy:
  name: mean_reversion
  params:
    bb_period: 20
    bb_std: 2.0
    rsi_period: 14
    oversold: 30
    overbought: 70
    allow_short: false
    max_position: 50

# --- Strategy allocation (for multi-strategy mode) ---
# Weights define how the engine's max_positions slots are distributed across
# strategies. A 0.30-weighted strategy gets ~30% of the concurrent position
# slots. Strategies not listed here share the remaining slots equally.
strategy_allocations:
  ema_crossover: 0.25
  mean_reversion: 0.20
  donchian_breakout: 0.15
  vwap_reversion: 0.10
  dual_momentum: 0.10
  sector_rotation: 0.10
  multi_factor: 0.05
  orb: 0.05

# --- Market filter (SPY 200-SMA + VIX proxy) ---
# When SPY is below its 200-SMA or the VIX proxy (VIXY) is spiked above its
# long-term average, new long entries are blocked market-wide. Existing
# positions are still managed (exits always allowed).
market_filter:
  enabled: true
  benchmark_symbol: SPY
  benchmark_sma_period: 200
  vix_proxy_symbol: VIXY
  vix_proxy_sma_period: 50
  vix_high_ratio: 1.5  # VIXY >= 1.5x its 50-SMA => crisis

# --- Backtest ---
backtest:
  symbol: SPY
  timeframe: 15m
  start: 2025-01-01
  end: 2025-06-30

# --- Alpaca ---
alpaca:
  paper: true
  data_delayed: false
