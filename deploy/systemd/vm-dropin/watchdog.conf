# Watchdog drop-in for the VM. NOT installed by default: the orchestrator decides
# whether the VM moves from Type=simple to the template's Type=notify.
#
# Today the VM runs Type=simple with no WatchdogSec, so a wedged account loop is
# never restarted. This drop-in makes the VM match the template: the web process
# sends READY=1 once it serves and WATCHDOG=1 while the engine gate allows it, and
# systemd kills and restarts a unit that stops pinging for 300 s (see
# docs/operations.md, "systemd watchdog").
#
# Install (after the vm-paths.conf drop-in, if any):
#   sudo install -d /etc/systemd/system/parayabuck.service.d
#   sudo install -m 0644 deploy/systemd/vm-dropin/watchdog.conf \
#        /etc/systemd/system/parayabuck.service.d/watchdog.conf
#   sudo systemctl daemon-reload
#   sudo systemctl restart parayabuck      # only inside an approved restart window
#
# Rollback: remove the file, daemon-reload, restart. Type=notify with a missing
# READY=1 leaves the unit in "activating" until the start timeout, so check
# `systemctl status parayabuck` after the restart.

[Service]
Type=notify
NotifyAccess=main
WatchdogSec=300
