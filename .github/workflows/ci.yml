name: CI

on:
  push:
  pull_request:
  # Weekly run, so pip-audit and the lock checks also see advisories published after the
  # last push (S3-5-1).
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

jobs:
  locks:
    # uv.lock is the single source for the project's runtime and dev dependencies.
    # requirements.lock (runtime) and requirements-dev.lock (runtime + dev tools) are
    # exports of it, so every shared pin is identical in CI, the Dockerfile and the VM.
    # The tooling used here (uv, pip-audit, build, pip) is NOT in uv.lock; it is pinned
    # by version below and is not hash-checked yet (open item S2-3-4).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install uv==0.11.4 pip-audit==2.10.1
      - name: uv.lock matches pyproject.toml
        run: uv lock --check
      - name: Requirement files are current exports of uv.lock
        run: |
          uv export --locked --no-emit-project --no-dev --format requirements.txt -o requirements.lock
          uv export --locked --no-emit-project --no-dev --extra dev --format requirements.txt -o requirements-dev.lock
          git diff --exit-code -- requirements.lock requirements-dev.lock
      - name: Dependency audit (runtime lock)
        if: always()
        run: pip-audit -r requirements.lock

  quality:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # No step pushes or fetches with the token; the unhashed build code below
          # must not be able to read it from .git/config.
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install pip==26.2.1
      - run: python -m pip install --require-hashes -r requirements-dev.lock
      - run: python -m pip install --no-deps .
      - run: python -m pip install build==1.6.0 pip-audit==2.10.1
        if: always()
      - run: ruff check .
        if: always()
      - run: ruff format --check .
        if: always()
      - run: mypy src
        if: always()
      - name: Record production file signatures (isolation gate)
        if: always()
        run: python scripts/check_production_isolation.py --record /tmp/before.json
      - name: Product pytest suite
        if: always()
        run: pytest -q
      - name: Verify production files untouched (isolation gate)
        if: always()
        run: python scripts/check_production_isolation.py --verify /tmp/before.json
      - name: Build source and wheel distributions
        if: always()
        run: python -m build
      - name: Smoke test installed wheel
        if: always()
        run: |
          python -m pip install --force-reinstall --no-deps dist/*.whl
          cd /tmp
          python -c "import parayabuck.web.server"
      - name: Dependency audit (installed test environment)
        if: always()
        run: pip-audit
      - name: Secret scan
        if: always()
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
