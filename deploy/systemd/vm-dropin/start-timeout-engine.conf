# Start-timeout drop-in for the engine unit (R2-4-3). The template sets
# TimeoutStartSec=900 because ExecStartPre runs the full SQLite integrity_check on
# every start. The VM's copied unit may not have it, and the 90 s systemd default
# fails a start on a grown ledger.
#
# Install on the VM (same pattern as hardening.conf):
#   sudo install -d /etc/systemd/system/parayabuck.service.d
#   sudo install -m 0644 deploy/systemd/vm-dropin/start-timeout-engine.conf \
#        /etc/systemd/system/parayabuck.service.d/start-timeout-engine.conf
#   sudo systemctl daemon-reload
#
# Check:
#   systemctl show parayabuck -p TimeoutStartUSec

[Service]
TimeoutStartSec=900
