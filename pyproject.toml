[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "parayabuck"
version = "0.1.0"
description = "Event-driven Alpaca trading engine for US stocks and crypto with a Web UI"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "requests>=2.31",
    "alpaca-py>=0.30",
    "fastapi>=0.100",
    "uvicorn>=0.20",
    "websockets>=12.0",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4", "mypy>=1.10"]

[project.scripts]
parayabuck = "parayabuck.web.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]

[tool.mypy]
python_version = "3.14"
strict = true
ignore_missing_imports = true
exclude = [".venv/", "build/", "tests/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
