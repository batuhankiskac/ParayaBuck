# VM drop-in for parayabuck-backup.service on the home-dir layout (checkout
# ~/ParayaBuck, user batuhankiskac). Example, not a template to copy blindly
# (S3-4-3): replace the home path and the user first, as in vm-paths.conf.
#
# Install (after the hardening and start-timeout drop-ins; a name must end in .conf):
#   sudo install -d /etc/systemd/system/parayabuck-backup.service.d
#   sudo install -m 0644 deploy/systemd/vm-dropin/vm-paths-backup.conf \
#        /etc/systemd/system/parayabuck-backup.service.d/vm-paths-backup.conf
#   sudo systemctl daemon-reload
#
# Every list-valued key is reset with an empty assignment first, so this drop-in
# replaces the template value instead of adding to it.
#
# ProtectHome stays read-only here, unlike the engine: the off-host copy must read
# its key file, and CLOUDSDK_CONFIG (below) keeps gcloud from using the deploy
# user's own login. Create the gcloud state directory once, owned by the service user:
#   sudo -u batuhankiskac install -d -m 0700 /home/batuhankiskac/ParayaBuck/data/gcloud
#
# Check the result with:
#   systemctl show parayabuck-backup -p User,WorkingDirectory,ProtectHome,TimeoutStartUSec,TimeoutStopUSec
#   systemctl show parayabuck-backup -p Environment | grep -o 'CLOUDSDK_CONFIG=[^ ]*'
#   systemctl cat parayabuck-backup

[Service]
User=batuhankiskac
Group=batuhankiskac
WorkingDirectory=/home/batuhankiskac/ParayaBuck
EnvironmentFile=
EnvironmentFile=/home/batuhankiskac/ParayaBuck/.env.backup
Environment=
Environment=ENV_PATH=/home/batuhankiskac/ParayaBuck/.env.backup
Environment=CLOUDSDK_CONFIG=/home/batuhankiskac/ParayaBuck/data/gcloud
ExecStart=
ExecStart=/home/batuhankiskac/ParayaBuck/.venv/bin/parayabuck backup
ProtectHome=read-only
ReadWritePaths=
ReadWritePaths=/home/batuhankiskac/ParayaBuck/data
TimeoutStopSec=120
