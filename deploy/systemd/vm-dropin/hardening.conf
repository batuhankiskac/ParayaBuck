# Hardening directives added to the templates by the 2026-10-27 audit wave 2 (S2-10).
# The VM units are hand-patched copies, so they do not receive the new template lines
# on a bundle update. Install this same file for each unit that runs on the VM:
#   parayabuck.service, parayabuck-backup.service, parayabuck-deadman.service
#
#   for u in parayabuck parayabuck-backup parayabuck-deadman; do
#     sudo install -d /etc/systemd/system/$u.service.d
#     sudo install -m 0644 deploy/systemd/vm-dropin/hardening.conf \
#          /etc/systemd/system/$u.service.d/hardening.conf
#   done
#   sudo systemctl daemon-reload
#
# Check: systemctl show parayabuck -p LimitCORE,ProtectClock,ProtectHostname,RestrictRealtime,KeyringMode,RemoveIPC
#
# Not included on purpose: MemoryDenyWriteExecute (VM trial item, see docs/deployment.md).

[Service]
LimitCORE=0
ProtectClock=true
ProtectHostname=true
RestrictRealtime=true
KeyringMode=private
RemoveIPC=true
