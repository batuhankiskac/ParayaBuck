name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  locks:
    # uv.lock is the single dependency source. requirements.lock (runtime) and
    # requirements-dev.lock (runtime + dev tools) are exports of it, so every
    # shared pin is identical in CI, the Dockerfile and the VM.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install uv==0.11.4 pip-audit
      - name: uv.lock matches pyproject.toml
        run: uv lock --check
      - name: Requirement files are current exports of uv.lock
        run: |
          uv export --locked --no-hashes --no-emit-project --no-dev --format requirements.txt -o requirements.lock
          uv export --locked --no-hashes --no-emit-project --no-dev --extra dev --format requirements.txt -o requirements-dev.lock
          git diff --exit-code -- requirements.lock requirements-dev.lock
      - name: Dependency audit (runtime lock)
        if: always()
        run: pip-audit -r requirements.lock

  quality:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-dev.lock
      - run: python -m pip install --no-deps .
      - run: python -m pip install build pip-audit
        if: always()
      - run: ruff check .
        if: always()
      - run: ruff format --check .
        if: always()
      - run: mypy src
        if: always()
      - name: Record production file signatures (isolation gate)
        if: always()
        run: python scripts/check_production_isolation.py --record /tmp/before.json
      - name: Product pytest suite
        if: always()
        run: pytest -q
      - name: Verify production files untouched (isolation gate)
        if: always()
        run: python scripts/check_production_isolation.py --verify /tmp/before.json
      - name: Build source and wheel distributions
        if: always()
        run: python -m build
      - name: Smoke test installed wheel
        if: always()
        run: |
          python -m pip install --force-reinstall --no-deps dist/*.whl
          cd /tmp
          python -c "import parayabuck.web.server"
      - name: Dependency audit (installed test environment)
        if: always()
        run: pip-audit
      - name: Secret scan
        if: always()
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
