name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-dev.lock .
      - run: python -m pip install build pip-audit
        if: always()
      - run: ruff check .
        if: always()
      - run: ruff format --check .
        if: always()
      - run: mypy src
        if: always()
      - name: Record production file signatures (isolation gate)
        if: always()
        run: python scripts/check_production_isolation.py --record /tmp/before.json
      - name: Focused OCP closure tests
        if: always()
        run: pytest -q tests/test_candidate_observation_parity.py tests/test_normalized_hash.py
      - name: Full pytest suite
        if: always()
        run: pytest
      - name: Verify production files untouched (isolation gate)
        if: always()
        run: python scripts/check_production_isolation.py --verify /tmp/before.json
      - name: Build source and wheel distributions
        if: always()
        run: python -m build
      - name: Smoke test installed wheel
        if: always()
        run: |
          python -m pip install --force-reinstall --no-deps dist/*.whl
          cd /tmp
          python -c "import parayabuck.web.server"
      - name: Dependency audit
        if: always()
        run: pip-audit
      - name: Secret scan
        if: always()
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
