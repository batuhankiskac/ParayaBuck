[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "parayabuck"
version = "0.1.0"
description = "Event-driven Alpaca trading engine for US stocks and crypto with a Web UI"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2,<3.1",
    "numpy>=1.26,<2.6",
    "pyyaml>=6.0,<7",
    "python-dotenv>=1.0,<2",
    "requests>=2.31,<3",
    "alpaca-py>=0.43.5,<0.44",
    "fastapi>=0.115,<0.140",
    "uvicorn>=0.30,<0.52",
    "websockets>=12.0,<17",
    "jinja2>=3.1,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4", "mypy>=1.10"]

[project.scripts]
parayabuck = "parayabuck.web.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
follow_imports = "skip"
disallow_untyped_decorators = false
disallow_subclassing_any = false
exclude = [".venv/", "build/", "tests/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
