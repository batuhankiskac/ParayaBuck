# Trading-host designation for the single runner of the shared Alpaca PAPER account.
# Only the designated host installs this drop-in. Every other machine must not,
# so a copy of the engine elsewhere refuses to start (the one-runner guard).
#
# Install on the trading host only:
#   sudo install -d /etc/systemd/system/parayabuck.service.d
#   sudo install -m 0644 deploy/systemd/vm-dropin/trading-host.conf \
#        /etc/systemd/system/parayabuck.service.d/trading-host.conf
#   sudo systemctl daemon-reload
#
# Check (prints the line, never the value of any secret):
#   systemctl show parayabuck -p Environment | grep -o 'PARAYABUCK_TRADING_HOST=[^ ]*'
#
# EnvironmentFile= overrides Environment=, so the designation is only as safe as
# the env file: doctor refuses PARAYABUCK_TRADING_HOST, HOST and
# PARAYABUCK_CONTAINER in .env, and the VM check (docs/deployment.md) confirms the
# key is not there.

[Service]
Environment=PARAYABUCK_TRADING_HOST=1
