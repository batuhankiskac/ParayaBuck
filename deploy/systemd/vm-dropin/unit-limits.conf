# Start-limit and stop-timeout values of parayabuck.service as a drop-in (D3-4-4).
# The template sets them in its [Unit] and [Service] sections; a drop-in-only rebuild
# of the VM unit would otherwise fall back to systemd's defaults (stop after 90 s,
# no restart limit). The values match the template: this file changes nothing
# while the template and the VM agree.
#
# Install:
#   sudo install -d /etc/systemd/system/parayabuck.service.d
#   sudo install -m 0644 deploy/systemd/vm-dropin/unit-limits.conf \
#        /etc/systemd/system/parayabuck.service.d/unit-limits.conf
#   sudo systemctl daemon-reload
#
# Check:
#   systemctl show parayabuck -p StartLimitIntervalUSec,StartLimitBurst,TimeoutStopUSec

[Unit]
StartLimitIntervalSec=600
StartLimitBurst=5

[Service]
TimeoutStopSec=180
