app:
  host: 127.0.0.1
  port: 8000
  open_browser: true
  auto_start_engine: true
  log_level: INFO
alpaca:
  paper: true
  data_delayed: false
  stock_feed: iex
data:
  equity_session: regular
  include_extended_hours: false
symbols:
- AAPL
- MSFT
- GOOGL
- TSLA
- NVDA
- AMZN
- SPY
- QQQ
- KO
- PEP
- JNJ
- JPM
- XOM
- XLK
- XLF
- XLE
- XLV
- XLY
- XLP
- XLI
- XLB
- XLU
- XLRE
- XLC
- BTC/USD
- ETH/USD
- SOL/USD
- ADA/USD
- XRP/USD
- DOGE/USD
- AVAX/USD
- LINK/USD
engine:
  timeframe: 5m
  higher_timeframe: 1h
  trading_enabled: true
  equity_trading_enabled: true
  crypto_trading_enabled: false
  live_trading_enabled: false
  manage_external_positions: false
  reject_stale_signals: true
  event_grace_seconds: 5
  data_finalization_grace_seconds: 2
  maximum_signal_age_seconds: 20
  maximum_queue_age_seconds: 30
  account_snapshot_ttl_seconds: 15
  account_poll_interval_seconds: 15
  maximum_account_age_for_entry_seconds: 30
  event_queue_capacity: 1024
  max_new_positions_per_cycle: 1
  strategy_profile: equity_5m_v1
  allow_short: false
  minimum_signal_score: 65.0
  warmup_bars: 250
  decision_db_path: data/runtime/parayabuck.sqlite3
  ai_logging_enabled: true
  ai_log_path: data/runtime/ai_decisions
  prediction_horizon_bars: 48
  risk:
    risk_per_trade_pct: 0.005
    max_position_pct: 0.1
    max_crypto_exposure_pct: 0.2
    max_sector_exposure_pct: 0.25
    max_gross_exposure_pct: 0.6
    max_positions: 5
    daily_loss_limit_pct: 0.0151
    max_drawdown_pct: 0.1001
    minimum_risk_reward: 1.8
    consecutive_loss_reduction_after: 3
