name: Deep research validation

on:
  push:
    paths:
      - ".github/workflows/**"
      - "pyproject.toml"
      - "uv.lock"
      - "requirements*.lock"
      - "tests/**"
      - "scripts/**"
      - "src/parayabuck/**"
      - "config/**"
      - "data/historical/**"
      - "docs/research/**"
      - "data/research_manifests/**"
      - "data/research_receipts/**"
      - "data/research/**"
      - "data/research_runs/**"
      - "AGENTS.md"
      - ".gitignore"
  pull_request:
    paths:
      - ".github/workflows/**"
      - "pyproject.toml"
      - "uv.lock"
      - "requirements*.lock"
      - "tests/**"
      - "scripts/**"
      - "src/parayabuck/**"
      - "config/**"
      - "data/historical/**"
      - "docs/research/**"
      - "data/research_manifests/**"
      - "data/research_receipts/**"
      - "data/research/**"
      - "data/research_runs/**"
      - "AGENTS.md"
      - ".gitignore"
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deep-research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-dev.lock .
      - name: Verify frozen R46 source pins
        run: >-
          pytest -q --strict-markers
          tests/research/test_r46_frozen_source_pins_2026_09_12.py
      - name: Run deep research contracts
        run: pytest -q --strict-markers -m "research and research_deep"
