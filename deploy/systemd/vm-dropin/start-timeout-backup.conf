# Start-timeout drop-in for the backup unit (R2-4-3, S2-7-1). The off-host copy may
# take up to 900 s per artifact and runs sequentially, and the integrity_check runs
# inside the same start. The template sets TimeoutStartSec=3600; the 90 s systemd
# default would SIGTERM a copy mid-upload with no backup_failed alert.
#
# Install on the VM (same pattern as hardening.conf):
#   sudo install -d /etc/systemd/system/parayabuck-backup.service.d
#   sudo install -m 0644 deploy/systemd/vm-dropin/start-timeout-backup.conf \
#        /etc/systemd/system/parayabuck-backup.service.d/start-timeout-backup.conf
#   sudo systemctl daemon-reload
#
# Check:
#   systemctl show parayabuck-backup -p TimeoutStartUSec

[Service]
TimeoutStartSec=3600
